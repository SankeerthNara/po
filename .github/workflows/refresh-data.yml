name: Refresh PR and coding stats

on:
  schedule:
    - cron: "0 * * * *" # hourly, like the old sync job
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Both scripts use only Node built-ins, so no npm install is needed.
      - run: node scripts/fetch-prs.mjs && node scripts/fetch-cp.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Committing new data triggers a Vercel production deploy.
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/prs.json src/data/cp.json
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "chore: refresh PR and coding stats"
          git push
